# No model pin: Codex uses its catalog default, the first picker-visible model,
# so a new generation arrives with the catalog. No service tier either: the
# Fast tier multiplies usage, so it is a per-session /fast choice, which
# features.fast_mode keeps available, never a default.
model_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"
personality = "none"
web_search = "live"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "trusted-workspace"

[auto_review]
policy = """
Approve only actions necessary for H's requested work. For request_permissions, approve turn-scoped filesystem reads needed to discover, inspect, search, or locally convert non-secret files or directories that H names or directs the agent to use; ordinary personal information and document formats are not credentials. Reject session-scoped grants, external writes, all other writes outside the workspace, secret or credential access, privileged actions, destructive state changes, uploads, remote mutations, and bypasses of safety checks. A local Git commit is eligible only after H explicitly approves the exact candidate in the conversation.
"""

[features]
fast_mode = true
hooks = true
js_repl = false
request_permissions_tool = true

# The commit gate: every `git commit` must match the candidate commit-candidate
# recorded. Hooks run outside the sandbox; project-local hooks load only in
# trusted projects.
[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "~/.agents/hooks/commit-gate"
timeout = 30

[agents]
default_subagent_reasoning_effort = "xhigh"

[permissions.trusted-workspace]
description = "Writable workspace and persistent scratch, scoped system/configuration reads, protected-path exclusions, and command network denied."
extends = ":workspace"

[permissions.trusted-workspace.workspace_roots]
"~/Projects/eyrie/scrape" = true

[permissions.trusted-workspace.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
# Literal system exclusions, also listed as copy patterns below. In 0.154.0,
# bwrap skips absent denies whose first missing component is outside writable
# roots; inside a writable root it can create a placeholder instead. These
# entries assume ordinary Projects/workspace and temp roots, not a system cwd
# or a TMPDIR relocated into a system tree. Existing-file masks still have the
# upstream descriptor limitation recorded in docs/maintenance.md.
"/etc/shadow" = "deny"
"/etc/shadow-" = "deny"
"/etc/gshadow" = "deny"
"/etc/gshadow-" = "deny"
"/etc/security/opasswd" = "deny"
"/etc/security/opasswd.old" = "deny"
"/etc/krb5.keytab" = "deny"
"/etc/ipsec.secrets" = "deny"
"/var/lib/NetworkManager/secret_key" = "deny"
"/var/lib/systemd/credential.secret" = "deny"
"/etc/ssl/private" = "deny"
"/etc/credstore" = "deny"
"/etc/credstore.encrypted" = "deny"
"/usr/lib/credstore" = "deny"
"/usr/lib/credstore.encrypted" = "deny"
"/etc/cryptsetup-keys.d" = "deny"
"/etc/NetworkManager/system-connections" = "deny"
"/usr/lib/NetworkManager/system-connections" = "deny"
"/var/lib/iwd" = "deny"
"/etc/wireguard" = "deny"
"/etc/openvpn" = "deny"
"/etc/ipsec.d/private" = "deny"
"/etc/samba/private" = "deny"
