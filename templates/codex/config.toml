"/var/crash" = "deny"
"/sys/kernel/debug" = "deny"
"/sys/kernel/tracing" = "deny"
# Virtual-path entries inform policy checks, not proof of OS-level masking:
# bwrap mounts fresh /proc after filesystem masks and supplies minimal /dev.
# Keep :minimal and ordinary runtime interfaces; no blanket /proc or /dev deny.
"/proc/kcore" = "deny"
"/proc/vmcore" = "deny"
"/dev/mem" = "deny"
"/dev/port" = "deny"
