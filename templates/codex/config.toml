# Positive system roots with the literal exclusions above. These static paths
# cannot classify nested user mounts or represent every future system root.
# /home has no blanket deny: that would hide narrower read-only home grants.
# :root keeps unlisted paths closed, subject to runtime/workspace/temp grants.
"/bin" = "read"
"/boot" = "read"
"/efi" = "read"
"/lib" = "read"
"/lib64" = "read"
"/sbin" = "read"
"/srv" = "read"
"/usr" = "read"
